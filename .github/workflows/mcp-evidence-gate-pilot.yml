name: MCP Evidence Gate adoption pilot Wave 1.5
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: 29c420ebb6783122653ae6cbec6ba0713c4b920a
      CORE_RUNTIME_SHA: 06567c840c1d68a4b45ff2d12d6e6c32898fff11
      TRIVY_VERSION: 0.74.0
      TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      TRIVY_EXECUTABLE_SHA256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and capture exact npm artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            if node -e 'process.exit(require("./package.json").scripts?.build?0:1)'; then pnpm run build; fi
          elif [ -f package-lock.json ]; then npm ci; npm run build --if-present
          else npm install; npm run build --if-present
          fi
          d="$RUNNER_TEMP/pack"; mkdir -p "$d"
          before="$RUNNER_TEMP/before"; after="$RUNNER_TEMP/after"
          find "$d" -maxdepth 1 -type f -printf '%f\n' | sort > "$before"
          npm pack --silent --pack-destination "$d" > "$RUNNER_TEMP/pack.stdout"
          find "$d" -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          mapfile -t new < <(comm -13 "$before" "$after" | grep '\.tgz$' || true)
          test "${#new[@]}" -eq 1
          artifact="$d/${new[0]}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          sha256sum "$artifact" | tee "$RUNNER_TEMP/artifact.sha256"
          stat -c 'artifact=%n size=%s' "$artifact" >> "$GITHUB_STEP_SUMMARY"
      - name: Download and verify pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_ARCHIVE_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP"
          echo "${TRIVY_EXECUTABLE_SHA256}  $RUNNER_TEMP/trivy" | sha256sum --check --strict
          "$RUNNER_TEMP/trivy" --version
      - name: Run immutable Producer
        id: producer
        shell: bash
        run: |
          set -u
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          python -m venv "$RUNNER_TEMP/venv"
          source "$RUNNER_TEMP/venv/bin/activate"
          pip install -q -e "$RUNNER_TEMP/producer"
          cd "$RUNNER_TEMP/producer"
          set +e
          python -m src.producer --trivy "$RUNNER_TEMP/trivy" --artifact "${{ steps.pack.outputs.artifact }}" --out "$RUNNER_TEMP/producer-out"
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          for f in receipt evidence; do echo "$f=$RUNNER_TEMP/producer-out/$f.json" >> "$GITHUB_OUTPUT"; done
          exit 0
      - name: Prepare digest-negative artifact
        id: tamper
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.pack.outputs.artifact }}" "$RUNNER_TEMP/tampered.tgz"
          printf '\n' >> "$RUNNER_TEMP/tampered.tgz"
          echo "artifact=$RUNNER_TEMP/tampered.tgz" >> "$GITHUB_OUTPUT"
      - name: Verify exact artifact with immutable Core Action
        id: gate
        if: always()
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@06567c840c1d68a4b45ff2d12d6e6c32898fff11
        with:
          receipt: ${{ steps.producer.outputs.receipt }}
          artifact: ${{ steps.pack.outputs.artifact }}
          evidence: ${{ steps.producer.outputs.evidence }}
          policy: strict-scanner-completeness
      - name: Verify tampered artifact is blocked
        id: negative
        if: always()
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@06567c840c1d68a4b45ff2d12d6e6c32898fff11
        with:
          receipt: ${{ steps.producer.outputs.receipt }}
          artifact: ${{ steps.tamper.outputs.artifact }}
          evidence: ${{ steps.producer.outputs.evidence }}
          policy: strict-scanner-completeness
      - name: Upload immutable evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-evidence-gate-wave15-${{ github.sha }}
          path: |
            ${{ runner.temp }}/artifact.sha256
            ${{ runner.temp }}/producer-out/receipt.json
            ${{ runner.temp }}/producer-out/evidence.json
            ${{ runner.temp }}/producer-out/trivy.raw.json
            ${{ runner.temp }}/producer-out/trivy.stderr.log
          retention-days: 90
          if-no-files-found: warn
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Wave 1.5 immutable pilot"
            echo "Producer: $PRODUCER_SHA"
            echo "Core runtime: $CORE_RUNTIME_SHA"
            echo "Gate outcome: ${{ steps.gate.outcome }} / ${{ steps.gate.outputs.decision }}"
            echo "Tampered outcome: ${{ steps.negative.outcome }} / ${{ steps.negative.outputs.decision }}"
          } >> "$GITHUB_STEP_SUMMARY"
