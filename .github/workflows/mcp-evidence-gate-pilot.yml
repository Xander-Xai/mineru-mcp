name: MCP Evidence Gate adoption pilot
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: 29c420ebb6783122653ae6cbec6ba0713c4b920a
      CORE_RUNTIME_SHA: 06567c840c1d68a4b45ff2d12d6e6c32898fff11
      TRIVY_VERSION: 0.74.0
      TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      TRIVY_EXECUTABLE_SHA256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Build would-be artifact
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm install --frozen-lockfile; pnpm run build --if-present; elif [ -f package-lock.json ]; then npm ci; npm run build --if-present; else npm install; npm run build --if-present; fi
          npm pack --json > "$RUNNER_TEMP/pack.json"
          ARTIFACT=$(python -c 'import json; print(json.load(open("'"$RUNNER_TEMP"'/pack.json"))[0]["filename"])')
          mkdir -p "$RUNNER_TEMP/artifact"; mv "$ARTIFACT" "$RUNNER_TEMP/artifact/release.tgz"
          sha256sum "$RUNNER_TEMP/artifact/release.tgz" | tee "$RUNNER_TEMP/artifact.sha256"
      - name: Download and verify pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_ARCHIVE_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP"
          echo "${TRIVY_EXECUTABLE_SHA256}  $RUNNER_TEMP/trivy" | sha256sum --check --strict
          "$RUNNER_TEMP/trivy" --version
      - name: Run immutable Producer
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          python -m venv "$RUNNER_TEMP/venv"; source "$RUNNER_TEMP/venv/bin/activate"; pip install -q -r "$RUNNER_TEMP/producer/requirements.txt"
          set +e
          python -m src.producer --trivy "$RUNNER_TEMP/trivy" --artifact "$RUNNER_TEMP/artifact/release.tgz" --out "$RUNNER_TEMP/producer-out"
          echo $? > "$RUNNER_TEMP/producer.exit"; set -e
      - name: Run immutable Core and digest-negative control
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" checkout --detach "$CORE_RUNTIME_SHA"
          corepack enable; pnpm --dir "$RUNNER_TEMP/core" install --frozen-lockfile; pnpm --dir "$RUNNER_TEMP/core" build
          set +e
          node "$RUNNER_TEMP/core/dist/cli.js" verify --receipt "$RUNNER_TEMP/producer-out/receipt.json" --artifact "$RUNNER_TEMP/artifact/release.tgz" --evidence "$RUNNER_TEMP/producer-out/evidence.json" --policy permissive --format json > "$RUNNER_TEMP/core.json"; echo $? > "$RUNNER_TEMP/core.exit"
          cp "$RUNNER_TEMP/artifact/release.tgz" "$RUNNER_TEMP/artifact-tampered.tgz"; printf '\n' >> "$RUNNER_TEMP/artifact-tampered.tgz"
          node "$RUNNER_TEMP/core/dist/cli.js" verify --receipt "$RUNNER_TEMP/producer-out/receipt.json" --artifact "$RUNNER_TEMP/artifact-tampered.tgz" --evidence "$RUNNER_TEMP/producer-out/evidence.json" --policy permissive --format json > "$RUNNER_TEMP/core-negative.json"; echo $? > "$RUNNER_TEMP/core-negative.exit"; set -e
      - name: Assemble evidence and summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          cp "$RUNNER_TEMP/artifact.sha256" "$RUNNER_TEMP/bundle/artifact.sha256" || true
          cp "$RUNNER_TEMP/producer-out"/{receipt.json,evidence.json,trivy.raw.json,trivy.stderr.log} "$RUNNER_TEMP/bundle/" || true
          cp "$RUNNER_TEMP/core.json" "$RUNNER_TEMP/core-negative.json" "$RUNNER_TEMP/bundle/" || true
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          b=Path(os.environ['RUNNER_TEMP'])/'bundle'; out=Path(os.environ['RUNNER_TEMP'])
          def val(n):
            try:return json.loads((b/n).read_text())
            except:return {}
          r=val('receipt.json'); e=val('evidence.json'); c=val('core.json'); n=val('core-negative.json')
          m={'upstream_repo':os.environ.get('GITHUB_REPOSITORY'),'upstream_base_sha':os.environ.get('GITHUB_SHA'),'fork_repo':os.environ.get('GITHUB_REPOSITORY'),'experiment_sha':os.environ.get('GITHUB_SHA'),'producer_sha':os.environ['PRODUCER_SHA'],'core_runtime_sha':os.environ['CORE_RUNTIME_SHA'],'artifact_type':'npm-tarball','artifact_sha256':hashlib.sha256((out/'artifact/release.tgz').read_bytes()).hexdigest(),'receipt_verdict':r.get('verdict'),'scanner_execution_status':e.get('scanner_execution',{}).get('completeness_status'),'gate_decision':c.get('decision'),'tampered_artifact_decision':n.get('decision'),'github_run_id':os.environ.get('GITHUB_RUN_ID'),'classification':'COMPATIBLE_PASS' if c.get('decision') in ('pass','warn') and n.get('decision') not in ('pass','warn') else 'COMPATIBLE_INCONCLUSIVE'}
          (b/'pilot-manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          print('| Field | Value |\n|---|---|\n| Producer | `'+m['producer_sha']+'` |\n| Core | `'+m['core_runtime_sha']+'` |\n| Receipt | `'+str(m['receipt_verdict'])+'` |\n| Scanner execution | `'+str(m['scanner_execution_status'])+'` |\n| Gate | `'+str(m['gate_decision'])+'` |\n| Tampered | `'+str(m['tampered_artifact_decision'])+'` |\n| Classification | `'+m['classification']+'` |')
          PY
          cat "$RUNNER_TEMP/bundle/pilot-manifest.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mcp-evidence-gate-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/bundle
          retention-days: 90
          if-no-files-found: warn